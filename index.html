<!DOCTYPE html>
<html lang="en">
<head>
    <script src="resources/jquery-4.0.0.js"></script>

    <!--
    fallback script that will uses jQuery CDN if local file fails
    -->
    <script>
        if (typeof jQuery === "undefined") {
            console.log("local file has failed, fallback script will start.");
            document.write('<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"><\/script>');
        } else {
            console.log("local file is successful.");
        }
    </script>
</head>
<body>
    <h1>Common Uses of jQuery</h1>
    <p>
        What I learned is that in jQuery, it simply is just a Document Object Model (DOM) that acts like a tree structure of all element. Its role is to
        find element in specific location, alter a certain amount of its attribute, or for it to react to a action.
    </p>
</body>
</html>
